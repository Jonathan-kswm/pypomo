[project]
name = "pypomo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jonathan Howard", email = "jonathan.howard.2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.2.0",
]

[project.scripts]
pypomo = "pypomo:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -v"
